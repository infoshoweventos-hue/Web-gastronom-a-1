<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="El verdadero café de especialidad y la mejor comida casera en Liniers. Hacé tu pedido o reservá tu mesa." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
  
  <link rel="stylesheet" href="brand.css" />
  <link rel="stylesheet" href="main.css" />

  <style>
    .nav__logo-img { height: 36px; width: auto; display: block; }
    .mobile-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 150; opacity: 0; pointer-events: none; transition: opacity var(--transition-normal); }
    .mobile-overlay.is-open { opacity: 1; pointer-events: all; }
    .mobile-menu { position: fixed; top: 0; right: 0; width: min(320px, 85vw); height: 100dvh; background: var(--color-bg-surface); border-left: 1px solid var(--color-border); z-index: 200; display: flex; flex-direction: column; padding: var(--space-8) var(--space-6); gap: var(--space-2); transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .mobile-menu.is-open { transform: translateX(0); }
    .mobile-menu__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-8); }
    .mobile-menu__close { color: var(--color-text-muted); font-size: 1.5rem; cursor: pointer; transition: color var(--transition-fast); }
    .mobile-menu__close:hover { color: var(--color-accent); }
    .mobile-menu__link { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-2); border-bottom: 1px solid var(--color-border); font-size: var(--text-lg); font-weight: var(--weight-semibold); color: var(--color-text-muted); transition: color var(--transition-fast); text-decoration: none; }
    .mobile-menu__link i { color: var(--color-accent); font-size: 1.25rem; }
    .mobile-menu__link:hover { color: var(--color-accent); }
    .mobile-menu__cta { margin-top: auto; padding-top: var(--space-8); }
    
    .hero { min-height: 100dvh; display: flex; align-items: center; padding-top: 80px; position: relative; overflow: hidden; }
    .hero__bg { position: absolute; inset: 0; z-index: 0; }
    .hero__bg img { width: 100%; height: 100%; object-fit: cover; opacity: 0.15; }
    .hero__bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, var(--color-bg) 40%, transparent 100%); }
    .hero .container { position: relative; z-index: 1; }
    .hero__badge { margin-bottom: var(--space-6); }
    .hero__title { margin-bottom: var(--space-6); }
    .hero__title em { font-style: normal; color: var(--color-accent); }
    .hero__subtitle { max-width: 540px; margin-bottom: var(--space-10); }
    .hero__actions { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .hero__scroll { position: absolute; bottom: var(--space-8); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: var(--space-2); color: var(--color-text-xmuted); font-size: var(--text-xs); letter-spacing: var(--tracking-wider); text-transform: uppercase; animation: bounce 2s infinite; }

    .clients { padding-block: var(--space-12); border-bottom: 1px solid var(--color-border); }
    .clients__label { text-align: center; font-size: var(--text-xs); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--color-text-xmuted); margin-bottom: var(--space-8); }
    .clients__logos { display: flex; align-items: center; justify-content: center; gap: var(--space-10); flex-wrap: wrap; opacity: 0.35; filter: grayscale(1); }
    .clients__logos span { font-family: var(--font-display); font-weight: var(--weight-black); font-size: var(--text-xl); color: var(--color-text-muted); letter-spacing: var(--tracking-tight); }

    .stats { background: var(--color-bg-surface); border-top: 1px solid var(--color-border); border-bottom: 1px solid var(--color-border); padding-block: var(--space-10); }
    .stats__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--space-8); text-align: center; }
    .stat__number { font-family: var(--font-display); font-size: clamp(var(--text-3xl), 5vw, var(--text-5xl)); font-weight: var(--weight-black); color: var(--color-accent); line-height: 1; margin-bottom: var(--space-2); }
    .stat__label { font-size: var(--text-sm); color: var(--color-text-muted); letter-spacing: var(--tracking-wide); text-transform: uppercase; }

    .services__header { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-8); flex-wrap: wrap; margin-bottom: clamp(var(--space-12), 6vw, var(--space-20)); }
    .service-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-top: 3px solid var(--color-accent); border-radius: var(--radius-lg); padding: var(--space-8); cursor: pointer; transition: transform var(--transition-normal), border-color var(--transition-normal), box-shadow var(--transition-normal); position: relative; overflow: hidden; }
    .service-card::before { content: ''; position: absolute; inset: 0; background: var(--color-accent-dim); opacity: 0; transition: opacity var(--transition-normal); }
    .service-card:hover { transform: translateY(-6px); box-shadow: 0 8px 32px rgba(211, 84, 0, 0.12); border-color: var(--color-accent); }
    .service-card:hover::before { opacity: 1; }
    .service-card__icon { width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; background: var(--color-accent); border-radius: var(--radius-md); color: var(--color-white); font-size: 1.6rem; margin-bottom: var(--space-5); position: relative; z-index: 1; transition: transform var(--transition-normal); }
    .service-card:hover .service-card__icon { transform: scale(1.1); }
    .service-card__title { font-family: var(--font-display); font-size: var(--text-xl); font-weight: var(--weight-bold); margin-bottom: var(--space-3); position: relative; z-index: 1; }
    .service-card__desc { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-loose); position: relative; z-index: 1; }
    .service-card__cta { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-5); font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-accent); letter-spacing: var(--tracking-wide); text-transform: uppercase; position: relative; z-index: 1; transition: gap var(--transition-fast); }
    .service-card:hover .service-card__cta { gap: var(--space-3); }

    .about__grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(var(--space-12), 8vw, var(--space-24)); align-items: center; }
    .about__visual { position: relative; aspect-ratio: 4/5; background: var(--color-bg-card); border-radius: var(--radius-xl); overflow: hidden; border: 1px solid var(--color-border); }
    .about__visual img { width: 100%; height: 100%; object-fit: cover; }
    .about__badge-floating { position: absolute; bottom: var(--space-6); left: var(--space-6); }
    .about__title { margin-bottom: var(--space-6); }
    .about__text { margin-bottom: var(--space-6); }
    .about__values { display: flex; flex-direction: column; gap: var(--space-4); margin-bottom: var(--space-8); }
    .about__value { display: flex; align-items: flex-start; gap: var(--space-3); }
    .about__value-icon { color: var(--color-accent); font-size: 1.25rem; flex-shrink: 0; margin-top: 2px; }
    .about__value-text { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-normal); }
    .about__value-title { font-weight: var(--weight-semibold); color: var(--color-text); display: block; margin-bottom: var(--space-1); }

    .testimonios { background: var(--color-bg-surface); }
    .testimonio-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-8); transition: border-color var(--transition-normal), transform var(--transition-normal); }
    .testimonio-card:hover { border-color: var(--color-accent); transform: translateY(-4px); }
    .testimonio-card__quote { font-size: 2.5rem; color: var(--color-accent); margin-bottom: var(--space-4); line-height: 1; font-family: var(--font-display); }
    .testimonio-card__text { font-size: var(--text-base); line-height: var(--leading-loose); color: var(--color-text-muted); margin-bottom: var(--space-6); }
    .testimonio-card__author { display: flex; align-items: center; gap: var(--space-3); }
    .testimonio-card__avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--color-accent); display: flex; align-items: center; justify-content: center; color: var(--color-white); font-weight: var(--weight-bold); font-family: var(--font-display); flex-shrink: 0; }
    .testimonio-card__name { font-weight: var(--weight-semibold); font-size: var(--text-sm); }
    .testimonio-card__role { font-size: var(--text-xs); color: var(--color-text-muted); }

    .cta-section { text-align: center; position: relative; overflow: hidden; }
    .cta-section::before { content: ''; position: absolute; bottom: -30%; left: 50%; transform: translateX(-50%); width: 800px; height: 400px; background: radial-gradient(ellipse, rgba(211,84,0,0.06) 0%, transparent 70%); pointer-events: none; }
    .cta-section__title { margin-bottom: var(--space-4); }
    .cta-section__subtitle { max-width: 480px; margin-inline: auto; margin-bottom: var(--space-10); }
    .cta-section__actions { display: flex; align-items: center; justify-content: center; gap: var(--space-4); flex-wrap: wrap; }
    .cta-section__trust { margin-top: var(--space-8); font-size: var(--text-xs); color: var(--color-text-xmuted); letter-spacing: var(--tracking-wide); display: flex; align-items: center; justify-content: center; gap: var(--space-2); }

    .footer { background: var(--color-bg-surface); border-top: 1px solid var(--color-border); padding-block: var(--space-12); }
    .footer__grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: var(--space-12); margin-bottom: var(--space-12); }
    .footer__brand-desc { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-loose); margin-top: var(--space-4); max-width: 280px; }
    .footer__col-title { font-size: var(--text-xs); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-wider); text-transform: uppercase; color: var(--color-text-muted); margin-bottom: var(--space-5); }
    .footer__links { display: flex; flex-direction: column; gap: var(--space-3); }
    .footer__links a { font-size: var(--text-sm); color: var(--color-text-muted); transition: color var(--transition-fast); display: flex; align-items: center; gap: var(--space-2); }
    .footer__links a:hover { color: var(--color-accent); }
    .footer__bottom { display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-8); border-top: 1px solid var(--color-border); flex-wrap: wrap; gap: var(--space-4); }
    .footer__copy { font-size: var(--text-xs); color: var(--color-text-xmuted); }
    .footer__social { display: flex; gap: var(--space-4); }
    .footer__social a { color: var(--color-text-xmuted); font-size: 1.25rem; transition: color var(--transition-fast); }
    .footer__social a:hover { color: var(--color-accent); }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 300; display: flex; align-items: flex-end; justify-content: center; opacity: 0; pointer-events: none; transition: opacity var(--transition-normal); padding: 0; }
    @media (min-width: 600px) { .modal-overlay { align-items: center; padding: var(--space-6); } }
    .modal-overlay.is-open { opacity: 1; pointer-events: all; }
    .modal { background: var(--color-bg-surface); border: 1px solid var(--color-border); border-top: 3px solid var(--color-accent); border-radius: var(--radius-xl) var(--radius-xl) 0 0; width: 100%; max-width: 560px; max-height: 90dvh; overflow-y: auto; padding: var(--space-8); transform: translateY(40px); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    @media (min-width: 600px) { .modal { border-radius: var(--radius-xl); transform: translateY(20px) scale(0.97); } }
    .modal-overlay.is-open .modal { transform: translateY(0) scale(1); }
    .modal__header { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); }
    .modal__icon-wrap { width: 56px; height: 56px; background: var(--color-accent); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--color-white); font-size: 1.75rem; flex-shrink: 0; }
    .modal__close { color: var(--color-text-muted); font-size: 1.5rem; cursor: pointer; transition: color var(--transition-fast); padding: var(--space-1); flex-shrink: 0; }
    .modal__close:hover { color: var(--color-accent); }
    .modal__title { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: var(--weight-bold); margin-bottom: var(--space-1); margin-top: var(--space-4); }
    .modal__tagline { font-size: var(--text-sm); color: var(--color-accent); font-weight: var(--weight-semibold); margin-bottom: var(--space-6); }
    .modal__body p { font-size: var(--text-sm); color: var(--color-text-muted); line-height: var(--leading-loose); margin-bottom: var(--space-4); }
    .modal__body ul { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-6); }
    .modal__body ul li { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); color: var(--color-text); }
    .modal__body ul li i { color: var(--color-accent); font-size: 1.1rem; flex-shrink: 0; }
    .modal__result { background: var(--color-accent-dim); border: 1px solid rgba(211,84,0,0.2); border-radius: var(--radius-md); padding: var(--space-5); display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-6); }
    .modal__result-number { font-family: var(--font-display); font-size: var(--text-3xl); font-weight: var(--weight-black); color: var(--color-accent); line-height: 1; white-space: nowrap; }
    .modal__result-label { font-size: var(--text-xs); color: var(--color-text-muted); line-height: var(--leading-normal); }
    .modal__cta { display: flex; align-items: center; justify-content: center; gap: var(--space-2); width: 100%; padding: var(--space-4); background: #25D366; color: #fff; border-radius: var(--radius-full); font-weight: var(--weight-semibold); font-size: var(--text-sm); letter-spacing: var(--tracking-wide); text-transform: uppercase; transition: background var(--transition-fast), transform var(--transition-fast); text-decoration: none; }
    .modal__cta:hover { background: #1ebe5d; transform: translateY(-2px); }

    .social-float { position: fixed; right: var(--space-5); bottom: var(--space-8); z-index: 90; }
    .social-float__btn { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; background: #25D366; color: #fff; box-shadow: 0 4px 20px rgba(37,211,102,0.4); transition: transform var(--transition-normal), box-shadow var(--transition-normal); position: relative; }
    .social-float__btn::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; background: #25D366; opacity: 0.3; animation: pulse-wa 2.5s ease-out infinite; }
    .social-float__btn:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(37,211,102,0.5); }
    @keyframes pulse-wa { 0% { transform: scale(1); opacity: 0.3; } 70% { transform: scale(1.4); opacity: 0; } 100% { transform: scale(1.4); opacity: 0; } }

    .welcome-toast { position: fixed; bottom: var(--space-8); left: var(--space-6); z-index: 200; background: var(--color-bg-card); border: 1px solid var(--color-accent); border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); max-width: 280px; box-shadow: 0 0 24px rgba(211,84,0,0.18); transform: translateY(120px); opacity: 0; transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .welcome-toast.show { transform: translateY(0); opacity: 1; }
    .welcome-toast__text { font-size: var(--text-sm); color: var(--color-text); line-height: var(--leading-normal); margin-bottom: var(--space-3); }
    .welcome-toast__text strong { color: var(--color-accent); }
    .welcome-toast__close { position: absolute; top: var(--space-2); right: var(--space-3); color: var(--color-text-xmuted); font-size: var(--text-lg); line-height: 1; cursor: pointer; }
    .welcome-toast__cta { font-size: var(--text-xs); color: var(--color-accent); font-weight: var(--weight-semibold); display: flex; align-items: center; gap: var(--space-1); }

    .btn--whatsapp { background: #25D366; color: #fff; }
    .btn--whatsapp:hover { background: #1ebe5d; }

    @media (max-width: 768px) { .nav__links { display: none; } .nav__mobile-toggle { display: block; } .about__grid { grid-template-columns: 1fr; } .about__visual { aspect-ratio: 16/9; } .footer__grid { grid-template-columns: 1fr; gap: var(--space-8); } .services__header { flex-direction: column; align-items: flex-start; } .social-float { bottom: var(--space-6); right: var(--space-4); } .welcome-toast { left: var(--space-4); right: var(--space-4); max-width: none; } }
  </style>
</head>
<body>

  <!-- WELCOME TOAST -->
  <div class="welcome-toast" id="welcomeToast">
    <span class="welcome-toast__close" id="toastClose">×</span>
    <p class="welcome-toast__text">
      👋 ¡Hola! Somos <strong>Lumbre</strong>.<br>
      ¿Querés hacer un pedido para retirar o reservar una mesa?
    </p>
    <a href="https://wa.me/5491125371329?text=Hola!%20Me%20gustar%C3%ADa%20hacer%20un%20pedido." target="_blank" rel="noopener" class="welcome-toast__cta">
      Escribinos por WhatsApp <i class="ph ph-arrow-right"></i>
    </a>
  </div>

  <!-- SOCIAL FLOAT -->
  <div class="social-float">
    <a href="https://wa.me/5491125371329?text=Hola!%20Me%20gustar%C3%ADa%20hacer%20un%20pedido." target="_blank" rel="noopener" class="social-float__btn" aria-label="WhatsApp">
      <i class="ph-fill ph-whatsapp-logo"></i>
    </a>
  </div>

  <!-- MODAL SERVICIOS -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal__header">
        <div class="modal__icon-wrap"><i id="modalIcon"></i></div>
        <button class="modal__close" id="modalClose" aria-label="Cerrar"><i class="ph ph-x"></i></button>
      </div>
      <h3 class="modal__title" id="modalTitle"></h3>
      <p class="modal__tagline" id="modalTagline"></p>
      <div class="modal__body" id="modalBody"></div>
      <a href="#" target="_blank" rel="noopener" class="modal__cta" id="modalCta">
        <i class="ph-fill ph-whatsapp-logo"></i>
        <span class="modal__cta-text"></span>
      </a>
    </div>
  </div>

  <!-- MOBILE OVERLAY & MENU -->
  <div class="mobile-overlay" id="mobileOverlay"></div>
  <div class="mobile-menu" id="mobileMenu">
    <div class="mobile-menu__header">
      <img src="assets/logo.svg" alt="Logo Lumbre" class="nav__logo-img" />
      <button class="mobile-menu__close" id="menuCloseBtn" aria-label="Cerrar menú"><i class="ph ph-x"></i></button>
    </div>
    <a href="#carta" class="mobile-menu__link"><i class="ph ph-coffee"></i> La Carta</a>
    <a href="#nosotros"  class="mobile-menu__link"><i class="ph ph-storefront"></
